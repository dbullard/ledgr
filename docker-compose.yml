services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ledgr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgr}
      POSTGRES_DB: ledgr
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c maintenance_work_mem=64MB
        -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql
    # Loopback only. The app reaches Postgres over the compose network, so this
    # mapping exists for host-side tooling (`pnpm dev:db`, `pnpm reset-password`).
    # A bare "5433:5432" binds every interface, and Docker's published ports
    # bypass host firewalls like ufw — that would put the database, with its
    # default password, on the LAN.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgr"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${LEDGR_IMAGE:-ghcr.io/dbullard/ledgr:latest}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-4200}:3000"
    volumes:
      - appdata:/data
      # Receipt files (<year>/<month>/<date>_<merchant>_<amount>.<ext>). Point
      # RECEIPTS_PATH at a NAS mount to keep them there; the default is a
      # Docker volume.
      - ${RECEIPTS_PATH:-receipts}:/data/receipts
      # Read-only view of the backup sidecar's folder, so Settings > Data
      # health can show when the last backup ran.
      - ${BACKUP_PATH:-backups}:/backups:ro
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      # "Today" and the current month come from this clock. The container
      # default is UTC, which rolls the month over mid-evening in the Americas.
      TZ: ${TZ:-UTC}
      LEDGR_DATA_DIR: /data
      # Superuser/owner — migrations and app-role provisioning only. RLS
      # policies (docs/rls-pilot.md) never restrict this role.
      DATABASE_URL: postgresql://ledgr:${POSTGRES_PASSWORD:-ledgr}@db:5432/ledgr
      # Restricted, non-superuser role the app actually queries through, so
      # RLS policies apply. ensure-app-role.mjs creates it on boot from these
      # credentials — reuses POSTGRES_PASSWORD rather than a separate secret
      # since both roles are equally trusted inside this container/network.
      APP_DATABASE_URL: postgresql://ledgr_app:${POSTGRES_PASSWORD:-ledgr}@db:5432/ledgr
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${PORT:-4200}}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:${PORT:-4200}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nightly pg_dump of the database into BACKUP_PATH, keeping the newest
  # BACKUP_KEEP dumps. Runs the same postgres image as `db`, so pg_dump always
  # matches the server version. After every attempt it writes status.json,
  # which the app reads (read-only) to show Settings > Data health.
  # Restore with scripts/restore.sh. This does NOT back up the `appdata`
  # volume (encryption key, session secret): keep a copy of that yourself,
  # and not in the same place as the dumps.
  backup:
    image: postgres:18-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-ledgr}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # Hour of day (0-23, container clock, UTC by default) for the nightly dump.
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      # Where the database is reachable from this container. The defaults fit
      # this file; a setup with host networking (database on 127.0.0.1, odd port)
      # sets both and adds `network_mode: host` to this service.
      BACKUP_DB_HOST: ${BACKUP_DB_HOST:-db}
      BACKUP_DB_PORT: ${BACKUP_DB_PORT:-5432}
    volumes:
      - ${BACKUP_PATH:-backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        DIR=/backups
        KEEP=$${BACKUP_KEEP:-14}
        HOUR=$${BACKUP_HOUR:-3}
        STATUS=$$DIR/status.json
        now() { date -u +%Y-%m-%dT%H:%M:%SZ; }
        prev_success() { sed -n 's/.*"lastSuccessAt":"\([^"]*\)".*/\1/p' "$$STATUS" 2>/dev/null | head -n 1; }
        write_status() { # success_at attempt_at error file
          ok="null"; [ -n "$$1" ] && ok="\"$$1\""
          er="null"; [ -n "$$3" ] && er="\"$$3\""
          fl="null"; sz="null"
          if [ -n "$$4" ] && [ -f "$$DIR/$$4" ]; then fl="\"$$4\""; sz=$$(wc -c < "$$DIR/$$4" | tr -d ' '); fi
          n=$$(ls -1 $$DIR/ledgr-*.dump 2>/dev/null | wc -l | tr -d ' ')
          printf '{"lastSuccessAt":%s,"lastAttemptAt":"%s","lastError":%s,"file":%s,"sizeBytes":%s,"count":%s}\n' \
            "$$ok" "$$2" "$$er" "$$fl" "$$sz" "$$n" > "$$DIR/.status.tmp" && mv "$$DIR/.status.tmp" "$$STATUS"
        }
        run_backup() {
          at=$$(now); ts=$$(date -u +%Y%m%d-%H%M%S); f=ledgr-$$ts.dump
          if msg=$$(pg_dump -h "$$BACKUP_DB_HOST" -p "$$BACKUP_DB_PORT" -U ledgr -Fc -f "$$DIR/$$f.part" ledgr 2>&1) \
             && msg=$$(pg_restore --list "$$DIR/$$f.part" 2>&1 >/dev/null) \
             && mv "$$DIR/$$f.part" "$$DIR/$$f"; then
            ls -1t $$DIR/ledgr-*.dump | tail -n +$$((KEEP + 1)) | xargs -r rm -f
            write_status "$$at" "$$at" "" "$$f"
            echo "backup ok: $$f"
          else
            rm -f "$$DIR/$$f.part"
            e=$$(printf '%s' "$$msg" | tr -d '"\\' | tr '\n' ' ' | cut -c1-200)
            write_status "$$(prev_success)" "$$at" "$${e:-backup failed}" ""
            echo "backup FAILED: $$e" >&2
          fi
        }
        # Back up right away on first start (or after downtime), then nightly.
        last=$$(ls -1t $$DIR/ledgr-*.dump 2>/dev/null | head -n 1)
        if [ -z "$$last" ] || [ -n "$$(find "$$last" -mmin +1200)" ]; then run_backup; fi
        while true; do
          h=$$(date +%H | sed 's/^0*//'); m=$$(date +%M | sed 's/^0*//'); s=$$(date +%S | sed 's/^0*//')
          wait=$$(( HOUR * 3600 - ($${h:-0} * 3600 + $${m:-0} * 60 + $${s:-0}) ))
          [ $$wait -le 0 ] && wait=$$((wait + 86400))
          echo "next backup in $$wait s"
          sleep $$wait
          run_backup
        done
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  appdata:
  receipts:
  backups:
